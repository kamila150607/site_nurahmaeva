{% extends 'salon/base.html' %}

{% block title %}Удаление услуги{% endblock %}

{% block content %}
<div class="card">
    <h2 class="card-title" style="color: var(--primary-red);">⚠️ Подтверждение удаления</h2>
    
    <p>Вы уверены, что хотите удалить услугу <strong>{{ service.procedure_name }}</strong>?</p>
    <p style="color: var(--gray-600);">Это действие нельзя отменить.</p>
    
    <form method="post" style="margin-top: 1.5rem;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑️ Да, удалить</button>
        <a href="{% url 'price_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
